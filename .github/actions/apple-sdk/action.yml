name: Fetch the Apple SDK
description: >-
  Copies the pinned Apple SDK archive onto the machine from the organization's private bucket for CI tools, and
  checks its SHA-256 before anything uses it (specs/0002-build.md, macOS). Only the macOS build and embedder jobs
  of .github/workflows/target.yml use it, with `id-token: write`: it signs in to Google Cloud with GitHub's OIDC
  token, through workload identity federation, as a read-only account. Apple's SDK is never published, packaged
  or logged; the archive stays in the job's temporary directory.
outputs:
  archive:
    description: The archive's path on the machine, checked against its SHA-256
    value: ${{ steps.copy.outputs.archive }}
runs:
  using: composite
  steps:
    # Not secrets: which provider and account a token from one of the organization's repositories may sign in as.
    - name: Sign in to read the organization's CI tools
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: projects/168731703350/locations/global/workloadIdentityPools/lanescape-ci-tools/providers/github
        service_account: lanescape-ci-tools-reader@lanescape-dev.iam.gserviceaccount.com
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - id: copy
      name: Copy and check the Apple SDK
      shell: bash
      env:
        # The pinned archive, as targets.json's mac_sdk names it (scripts/check.py keeps the two the same). An
        # object in the bucket never changes: a new SDK is a new path.
        OBJECT: gs://lanescape-ci-tools/macos/sdk/26.2/MacOSX26.2.sdk.tar.zst
        SHA256: d0e54770d60e077c5c55ad66cbbed99a4b06dd9c4ecfc4a66e695dd00c2eab9f
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/apple-sdk"
        rm -rf "$directory"
        mkdir -p "$directory"
        archive="$directory/${OBJECT##*/}"
        gcloud storage cp --no-user-output-enabled "$OBJECT" "$archive"
        if ! echo "$SHA256  $archive" | sha256sum --check --status; then
          echo "::error::The Apple SDK archive does not match its pinned SHA-256"
          exit 1
        fi
        echo "archive=$archive" >>"$GITHUB_OUTPUT"
