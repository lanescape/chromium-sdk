name: CD

# Every push to main publishes the next version of its Chromium pin as a GitHub release: every target built, tested,
# and published with its notices and corresponding source (specs/0003-ci-cd.md, CD). Each target is its own chain in
# target.yml, build → embedder → test, which starts once the checks pass, and publishing needs every chain. One run
# at a time, each in its turn, in the order they began to wait, and none cancelled, waiting or running, so versions
# are numbered in the order their commits reached main and every commit gets its own.

on:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: cd
  cancel-in-progress: false
  queue: max

jobs:
  version:
    name: Version
    runs-on: lanescape-2vcpu-linux-amd64
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: lanescape/actions/checkout@5564b7b486d73e407d7f9adcf6723f3f4a8e97b6 # v1
      - name: Fetch release tags and history
        run: git fetch --quiet --tags --unshallow origin 2>/dev/null || git fetch --quiet --tags origin
      - id: version
        run: python3 scripts/version.py main | python3 scripts/cd_summary.py

  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  # Each call's job grants its chain's token: `id-token: write` only for macOS, to fetch the Apple SDK.
  linux-amd64:
    name: linux-amd64
    needs: [version, checks]
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/target.yml
    permissions:
      contents: read
    with:
      target: linux-amd64
      version: ${{ needs.version.outputs.version }}
      release: true

  linux-arm64:
    name: linux-arm64
    needs: [version, checks]
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/target.yml
    permissions:
      contents: read
    with:
      target: linux-arm64
      version: ${{ needs.version.outputs.version }}
      release: true

  macos-arm64:
    name: macos-arm64
    needs: [version, checks]
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/target.yml
    permissions:
      contents: read
      id-token: write
    with:
      target: macos-arm64
      version: ${{ needs.version.outputs.version }}
      release: true

  publish:
    name: Publish
    needs: [version, checks, linux-amd64, linux-arm64, macos-arm64]
    runs-on: lanescape-2vcpu-linux-amd64
    permissions:
      contents: write
    steps:
      - uses: lanescape/actions/checkout@5564b7b486d73e407d7f9adcf6723f3f4a8e97b6 # v1
      - name: Fetch release tags and history
        run: git fetch --quiet --tags --unshallow origin 2>/dev/null || git fetch --quiet --tags origin
      - name: Check this is still the next version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          now="$(python3 scripts/version.py main)"
          if [ "$(jq -r .version <<<"$now")" != "$VERSION" ]; then
            echo "::error::A release appeared since this run chose $VERSION: $(jq -r '.reason // .version' <<<"$now")"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sdk-*
          path: ${{ runner.temp }}/jobs
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          python3 scripts/publish.py gather "$release" "$RUNNER_TEMP"/jobs/*
          python3 scripts/publish.py manifest "$release" --version "$VERSION" --commit "$COMMIT" \
            --repository "$GITHUB_REPOSITORY"
          python3 scripts/publish.py release "$release"
